<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Angkas / Moovit Clone</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>🚖 Transit App</h2>

<input id="originInput" placeholder="From...">
<div id="originResults"></div>

<input id="destinationInput" placeholder="To...">
<div id="destinationResults"></div>

<h3>Pickup Points</h3>
<div id="pickupBox"></div>

<h3>Routes</h3>

<div class="route-card" data-i="0">⚡ Fastest</div>
<div class="route-card" data-i="1">💰 Cheapest</div>
<div class="route-card" data-i="2">🚌 Least Transfers</div>

<button id="reset">Reset</button>

</div>

<div id="map"></div>

</div>

<script src="script.js"></script>

</body>
</html>
