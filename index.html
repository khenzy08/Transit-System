<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transit Route Optimizer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>🚌 Transit Route Optimizer</h2>

        <div class="instructions">
            <strong>Instructions:</strong>
            <br><br>
            Click the map:
            <br>
            📍 First click = Starting Point
            <br>
            🎯 Second click = Destination
        </div>

        <h3>Route Options</h3>

        <div class="route-panel">

            <div class="route-card active" data-route="0">

                <img
                    src="https://cdn-icons-png.flaticon.com/512/744/744465.png"
                    class="route-icon"
                >

                <div>
                    <h4>Fastest Route</h4>
                    <p>25 mins</p>
                </div>

            </div>

            <div class="route-card" data-route="1">

                <img
                    src="https://cdn-icons-png.flaticon.com/512/3523/3523887.png"
                    class="route-icon"
                >

                <div>
                    <h4>Cheapest Route</h4>
                    <p>32 mins</p>
                </div>

            </div>

            <div class="route-card" data-route="2">

                <img
                    src="https://cdn-icons-png.flaticon.com/512/2972/2972185.png"
                    class="route-icon"
                >

                <div>
                    <h4>Fewest Transfers</h4>
                    <p>28 mins</p>
                </div>

            </div>

        </div>

        <button id="resetBtn">
            Reset Route
        </button>

    </div>

    <div id="map"></div>

</div>

<script src="script.js"></script>

</body>
</html>
