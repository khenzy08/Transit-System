<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transit Route Optimizer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>🚌 Transit Route Optimizer</h2>

<!-- START -->
<h3>Starting Point</h3>
<input id="originInput" placeholder="Search starting location">
<div id="originResults" class="results"></div>

<!-- PICKUP OPTIONS -->
<h4>Suggested Pickup Points</h4>
<div id="pickupOptions"></div>

<!-- DESTINATION -->
<h3>Destination</h3>
<input id="destinationInput" placeholder="Search destination">
<div id="destinationResults" class="results"></div>

<!-- ROUTES -->
<h3>Route Options</h3>

<div class="route-card active" data-route="0">
⚡ Fastest Route
</div>

<div class="route-card" data-route="1">
💰 Cheapest Route
</div>

<div class="route-card" data-route="2">
🚌 Least Transfers
</div>

<button id="resetBtn">Reset</button>

</div>

<!-- MAP -->
<div id="map"></div>

</div>

<script src="script.js"></script>

</body>
</html>
