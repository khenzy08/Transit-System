<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transit System Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<div class="container">

<div class="sidebar">

<h2>🚌 Transit Pro System</h2>

<h3>Origin</h3>
<input id="originInput" placeholder="Search location">
<div id="originResults"></div>

<h4>Pickup Points</h4>
<div id="pickupOptions"></div>

<h3>Destination</h3>
<input id="destinationInput" placeholder="Search destination">
<div id="destinationResults"></div>

<h3>Routes</h3>

<div class="route-card" data-route="0">⚡ Fastest Route</div>
<div class="route-card" data-route="1">🛣️ Shortest Route</div>
<div class="route-card" data-route="2">🚶 Least Walking</div>

<button id="resetBtn">Reset</button>

</div>

<div id="map"></div>

</div>

<script src="script.js"></script>

</body>
</html>
