<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transit Route Optimizer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>🚌 Transit Route Optimizer</h2>

        <div class="search-box">

            <label>Starting Location</label>

            <input
                type="text"
                id="originInput"
                placeholder="Search address..."
            >

            <div
                id="originResults"
                class="results">
            </div>

            <label>Destination</label>

            <input
                type="text"
                id="destinationInput"
                placeholder="Search address..."
            >

            <div
                id="destinationResults"
                class="results">
            </div>

        </div>

        <div class="route-panel">

            <div class="route-card active"
                 data-route="0">

                <span class="emoji">⚡</span>

                <div>
                    <h4>Fastest</h4>
                    <p>25 mins</p>
                </div>

            </div>

            <div class="route-card"
                 data-route="1">

                <span class="emoji">💰</span>

                <div>
                    <h4>Cheapest</h4>
                    <p>32 mins</p>
                </div>

            </div>

            <div class="route-card"
                 data-route="2">

                <span class="emoji">🚌</span>

                <div>
                    <h4>Least Transfers</h4>
                    <p>28 mins</p>
                </div>

            </div>

        </div>

        <button id="clearBtn">
            Reset
        </button>

    </div>

    <div id="map"></div>

</div>

<script src="script.js"></script>

</body>
</html>
